# Minimal SPIRE server for local development.
#
# Phase 2 needs an issuer: something that mints real X509-SVIDs and publishes a real
# trust bundle, so the verifier in internal/identity is tested against SPIRE output
# rather than only against certificates our own tests generated.
#
# There is no SPIRE agent here. An agent exists to hand SVIDs to workloads through
# the Workload API, and no workload fetches one yet. It arrives with the process that
# needs it.

server {
    bind_address  = "0.0.0.0"
    bind_port     = "8081"
    trust_domain  = "acme.example"
    data_dir      = "/opt/spire/data"
    log_level     = "INFO"

    ca_ttl                = "24h"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    KeyManager "memory" {
        plugin_data {}
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8180"
    live_path        = "/live"
    ready_path       = "/ready"
}
