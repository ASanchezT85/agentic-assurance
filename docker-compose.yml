# Local development only. Credentials here are non-secret development defaults.
# Production secrets come from a secret manager / KMS (MASTER_BUILD_SPEC.md §35).
#
# Ports (documented per Phase 0 handoff §5):
#   5432  PostgreSQL          8123  ClickHouse HTTP     9000  ClickHouse native
#   6379  Redis               4222  NATS client         8222  NATS monitoring
#
# Start:  docker compose up -d
# Health: docker compose ps
# Stop:   docker compose down          (add -v to drop volumes)

name: agentic-assurance

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assurance
      POSTGRES_USER: assurance
      POSTGRES_PASSWORD: assurance_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assurance -d assurance"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_DB: assurance
      CLICKHOUSE_USER: assurance
      CLICKHOUSE_PASSWORD: assurance_dev_only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/docker/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    # Redis is ephemeral by design (ADR-015, spec §33.3). No persistence, and
    # nothing authoritative may be stored here.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Issues real X509-SVIDs and publishes the trust bundle that internal/identity
  # verifies against. No agent: nothing fetches an SVID through the Workload API yet.
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.2
    # The image runs as uid 1000, but a fresh named volume is created root-owned,
    # so SPIRE cannot create its SQLite datastore. Declaring the uid here makes
    # Docker chown the volume on first mount.
    user: "1000:1000"
    command: ["-config", "/run/spire/config/server.conf"]
    volumes:
      - ./infra/docker/spire/server.conf:/run/spire/config/server.conf:ro
      # A bind mount rather than a named volume: a fresh named volume is created
      # root-owned and the image runs as uid 1000, so SPIRE cannot create its
      # datastore inside it.
      - ./infra/docker/spire/data:/opt/spire/data
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # The evidence archive.
  #
  # S3-compatible rather than S3, because a customer's evidence archive is the thing
  # they are most likely to want in their own bucket, their own region or their own
  # building. This is the local stand-in the retention export/restore path is tested
  # against; nothing on the hot path touches it.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: assurance
      MINIO_ROOT_PASSWORD: assurance_minio_dev_only
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  clickhouse-data:
  nats-data:
  minio-data:
