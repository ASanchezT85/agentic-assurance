# Local development only. Credentials here are non-secret development defaults.
# Production secrets come from a secret manager / KMS (MASTER_BUILD_SPEC.md §35).
#
# Ports (documented per Phase 0 handoff §5):
#   5432  PostgreSQL          8123  ClickHouse HTTP     9000  ClickHouse native
#   6379  Redis               4222  NATS client         8222  NATS monitoring
#
# Start:  docker compose up -d
# Health: docker compose ps
# Stop:   docker compose down          (add -v to drop volumes)

name: agentic-assurance

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assurance
      POSTGRES_USER: assurance
      POSTGRES_PASSWORD: assurance_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assurance -d assurance"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_DB: assurance
      CLICKHOUSE_USER: assurance
      CLICKHOUSE_PASSWORD: assurance_dev_only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/docker/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    # Redis is ephemeral by design (ADR-015, spec §33.3). No persistence, and
    # nothing authoritative may be stored here.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  clickhouse-data:
  nats-data:
