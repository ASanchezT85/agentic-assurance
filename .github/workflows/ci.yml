name: CI

on:
  push:
    # The repository default branch is master; main is accepted too so a future
    # rename does not silently stop triggering CI.
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "These files need gofmt:"; gofmt -l .; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet (integration build tag)
        run: go vet -tags=integration ./tests/integration/...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o bin/ ./cmd/...

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/console-web lint
      - run: pnpm -C apps/console-web typecheck
      - run: pnpm -C apps/console-web build

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # numpy is a runtime dependency as of Phase 11: the twin's determinism rests
      # on numpy.random.Generator, whose stream is reproducible from a seed.
      - run: python -m pip install --quiet "numpy>=2.1"
      - run: python -m pip install --quiet pytest ruff mypy
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -q

  # The race detector, which cannot run on every developer machine: it needs cgo, and
  # a Windows host without gcc cannot build it. Running it here means the concurrency
  # guarantees in the Phase 15 gate are actually checked somewhere.
  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test -race -count=1 ./internal/... ./tests/security/... ./tests/scenarios/...

  # Structure, schema compatibility and scope guards. Separated from the `go` job so
  # a failure here reads as "the repository drifted", not "the code broke".
  guards:
    name: Structure and scope guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Repository structure
        run: go test -count=1 ./tests/...
      - name: Stress library (all twelve scenarios)
        run: go test -count=1 -v ./tests/scenarios/...
      - name: Schema compatibility
        run: go test -count=1 ./packages/...

  integration:
    name: Infrastructure smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Apply migrations
        run: sh scripts/migrate.sh
      - name: Smoke test
        run: go test -tags=integration -count=1 ./tests/integration/...
      - name: Tenant isolation, append-only evidence
        run: go test -tags=integration -count=1 ./tests/security/...
      - name: Benchmarks (gateway overhead asserted, ingest measured)
        run: go test -tags=integration -count=1 -v ./tests/performance/...
      # Last, and on its own tag: it stops the containers the steps above need.
      - name: Chaos suite (stops real services)
        run: go test -tags=chaos -count=1 -timeout 15m -v ./tests/chaos/...
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
