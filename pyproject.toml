[project]
name = "agentic-assurance-simulator"
version = "0.0.0"
description = "Digital Twin simulator for the Agentic Order-Flow Assurance Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander J Sanchez T" }]
dependencies = []

[project.optional-dependencies]
# Baseline quantitative libraries from MASTER_BUILD_SPEC.md §9.2. Not imported in
# Phase 0 — the simulator has no implementation yet (handoff §4).
sim = [
  "numpy>=2.1",
  "polars>=1.20",
  "scipy>=1.14",
  "pyarrow>=18.0",
  "duckdb>=1.1",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["simulator"]

[tool.pytest.ini_options]
testpaths = ["simulator"]
pythonpath = ["."]
